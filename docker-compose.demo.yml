# ================================
# SafeEntry / Admin Residencial - Stack Demo
# Backend (Node) + Frontend (nginx) + MongoDB
#
# Uso:
#   docker compose --env-file .env.docker -f docker-compose.demo.yml up -d --build
# ================================

services:
  mongo:
    image: mongo:6
    container_name: safeentry-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - safeentry-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safeentry-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/adminResidencial
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_CEDULA: ${ADMIN_CEDULA:-99999999}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      FRONTEND_URL_LOCAL: http://localhost:8080
      FRONTEND_URL_PROD: https://safe-entry-neon.vercel.app
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - safeentry-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_POWERBI_EMBED_URL: ${VITE_POWERBI_EMBED_URL:-}
    container_name: safeentry-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - safeentry-net

networks:
  safeentry-net:
    driver: bridge

volumes:
  mongo-data:
    name: safeentry-mongo-data
