# ================================
# Admin Residencial - Docker Compose
# ================================
# Uso: docker-compose up -d

version: '3.8'

services:
  # ================================
  # Aplicación Node.js
  # ================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admin-residencial-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/adminResidencial
      - JWT_SECRET=${JWT_SECRET:-tu_clave_secreta_cambiar_en_produccion}
      - ADMIN_CEDULA=${ADMIN_CEDULA:-123456789}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - app-logs:/app/logs
    networks:
      - admin-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ================================
  # MongoDB
  # ================================
  mongodb:
    image: mongo:6
    container_name: admin-residencial-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - admin-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ================================
# Redes
# ================================
networks:
  admin-network:
    driver: bridge

# ================================
# Volúmenes persistentes
# ================================
volumes:
  mongodb-data:
    name: admin-residencial-mongodb-data
  app-logs:
    name: admin-residencial-logs
